name: Mirror wedstrijdgegevens

# Vult data/matches.json met sporthal, veldnummer en coordinaten per wedstrijd.
# Die staan niet in de RSS-feed, wel in /competitie/wedstrijden van de Nevobo-API.
# Vier keer per dag, zodat een laat gewijzigde veldindeling snel meekomt.

on:
  schedule:
    - cron: '27 */6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/mirror-matches.yml'
      - 'scripts/build_matches.py'

permissions:
  contents: write

concurrency:
  group: mirror-matches
  cancel-in-progress: false

jobs:
  matches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Wedstrijdgegevens ophalen
        run: python3 scripts/build_matches.py

      - name: Committen als er iets is veranderd
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/matches.json)" ]; then
            echo "Wedstrijdgegevens ongewijzigd."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/matches.json
          git commit -m "Wedstrijdgegevens bijwerken ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push

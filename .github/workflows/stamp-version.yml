name: Versiestempel

# Zet in data/version.json wanneer elke pagina voor het laatst is gewijzigd,
# zodat het label in de header meeloopt in plaats van hardgecodeerd te blijven.
# Let op: data/ staat bewust niet in de paths-filter, anders zou de commit van
# deze workflow zichzelf opnieuw starten.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-version
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git log per bestand heeft historie nodig

      - name: version.json bouwen
        run: python3 scripts/build_version.py

      - name: Committen als er iets is veranderd
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain data/version.json)" ]; then
            echo "Versiestempel ongewijzigd."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/version.json
          git commit -m "Versiestempel bijwerken"
          # De andere workflows committen ook naar main; als er tussendoor een
          # commit is bijgekomen wordt de push geweigerd. Dan rebasen en opnieuw.
          for poging in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push geweigerd, opnieuw na rebase (poging $poging)"
            git pull --rebase --autostash origin main
          done
          echo "Push bleef falen." >&2
          exit 1

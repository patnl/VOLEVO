<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=4fcc8f3ef3cc"></script>
<script src="../shared/wedstrijden.js?v=d3a7e810f0e3"></script>
<script src="app.js?v=4b967e4ff5cd"></script>
</head>
<body>
<script>
// Programma: alle komende wedstrijden per dag. Een rij klapt open voor adres, reistijd, beurten en knoppen.
var AANTAL = 20, getoond = AANTAL, laatsteKeuze = null;
function toonProgramma(D, naam) {
  var b = App.bereik(naam, 'programma.html'), start = new Date(); start.setHours(0, 0, 0, 0);
  var alle = D.wedstrijden.filter(function (w) { return b.alle || App.team(w, naam); });
  var lijst = Wedstrijden.speelbaar(alle).filter(function (w) { return w.tijdstip && new Date(w.tijdstip) >= start; })
    .sort(function (a, b) { return new Date(a.tijdstip) - new Date(b.tijdstip); });
  var html = App.kop('Wedstrijden') + App.wedstrijdenKeuze('programma', b.zoek) + b.html + App.vervallenMeldingen(alle);
  if (!lijst.length) return html + '<div class="melding leeg"><strong>Geen wedstrijden voor deze keuze</strong>Kies een ander team, of kijk later nog eens.</div>';
  // Bij alle teams: veel wedstrijden op één dag in dezelfde andere hal (een toernooi van de mini's) worden één rij
  var rijen = [], groepen = {};
  lijst.forEach(function (w) {
    var k = App.dagSleutel(new Date(w.tijdstip)) + '|' + (w.hal || '') + '|' + (w.plaats || '');
    (groepen[k] = groepen[k] || []).push(w);
  });
  lijst.forEach(function (w) {
    var k = App.dagSleutel(new Date(w.tijdstip)) + '|' + (w.hal || '') + '|' + (w.plaats || ''), g = groepen[k];
    if (!b.alle || w.hal === 'De Fluit' || g.length <= 8) rijen.push({ w: w });
    else if (g[0] === w) rijen.push({ toernooi: g });
  });
  var zichtbaar = rijen.slice(0, getoond), dag = '';
  html += '<section class="lijst" aria-label="Programma ' + App.esc(b.alle ? 'alle teams' : App.teamNaam(naam)) + '">';
  zichtbaar.forEach(function (r) {
    var w = r.w || r.toernooi[0], d = new Date(w.tijdstip), k = App.dagSleutel(d);
    if (k !== dag) { html += '<h2 class="dagkop">' + App.esc(App.dagTekst(d)) + '</h2>'; dag = k; }
    html += r.w ? App.wedstrijdRij(w, D, b.alle ? { team: '', jij: !!naam && App.team(w, naam) } : {}) : toernooiRij(r.toernooi, D, naam);
  });
  html += '</section>';
  html += '<p class="klein">' + zichtbaar.length + ' van ' + rijen.length + ' getoond, vanaf vandaag</p>';
  if (rijen.length > getoond) html += '<button class="knop" id="meer">Toon meer wedstrijden</button>';
  return html;
}
function toernooiRij(g, D, naam) {
  var eerste = new Date(g[0].tijdstip), laatste = new Date(g[g.length - 1].tijdstip), teams = [];
  g.forEach(function (w) { [w.thuis, w.uit].forEach(function (n) { var c = Wedstrijden.teamCode(n); if (c !== null && teams.indexOf(c) === -1) teams.push(c); }); });
  teams.sort(function (a, b) { return a.localeCompare(b, 'nl', { numeric: true }); });
  var route = App.routeUrl(g[0]);
  return '<details class="rij toernooi"><summary><div><div class="t">' + App.esc(App.tijd(eerste)) + '</div><div class="d">tot ' + App.esc(App.tijd(laatste)) + '</div></div>' +
    '<div><div class="w">' + g.length + ' wedstrijden in ' + App.esc(g[0].hal || 'een andere sporthal') + '</div><div class="o">' + App.esc(g[0].plaats || '') + (teams.length ? ', met ' + App.esc(teams.length > 4 ? teams.slice(0, 3).join(', ') + ' en nog ' + (teams.length - 3) + ' teams' : App.opsomming(teams)) : '') + '</div></div>' + App.icoon('omlaag') + '</summary>' +
    '<div class="meer"><p>' + App.esc(Wedstrijden.locatie(g[0]).adres) + '</p>' +
    (route ? '<div class="acties"><a class="knop" target="_blank" rel="noopener" aria-label="Route naar ' + App.esc(g[0].hal || 'de sporthal') + '" href="' + App.esc(route) + '">Route</a></div>' : '') +
    '<p>' + g.map(function (w) { return App.esc(App.tijd(new Date(w.tijdstip)) + ' ' + App.kortTeam(w.thuis) + ' tegen ' + App.kortTeam(w.uit) + (w.veld ? ', veld ' + w.veld : '')); }).join('<br>') + '</p></div></details>';
}
document.addEventListener('click', function (e) { if (e.target.id === 'meer') { getoond += AANTAL; App.hertoon(); } });
App.start({
  pagina: 'programma', titel: 'Programma', teamKeuze: 'optioneel',
  bewaar: function () { return { getoond: getoond }; },
  herstel: function (e) { if (e && e.getoond) { getoond = e.getoond; laatsteKeuze = undefined; } },
  toon: function (D, naam) {
    if (laatsteKeuze === undefined) laatsteKeuze = naam;
    if (naam !== laatsteKeuze) { getoond = AANTAL; laatsteKeuze = naam; }
    return toonProgramma(D, naam);
  }
});
</script>
</body>
</html>

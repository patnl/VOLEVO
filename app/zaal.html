<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A3176">
<title>VOLEVO · Zaalindeling</title>
<link rel="stylesheet" href="app.css?v=b02a7fc83271">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=f23fd34a8eec"></script>
<script src="../shared/wedstrijden.js?v=47d9ac833da4"></script>
<script src="../shared/zaal.js?v=1e846f9baa5d"></script>
<script src="app.js?v=f1542e1f40da"></script>
</head>
<body>
<script>
// Zaalindeling in De Fluit voor op de telefoon. Een wedstrijdkaart linkt hierheen met ?dag=&ronde=&veld=,
// dan kleurt het veld van die wedstrijd. Zonder ?veld= kleuren de wedstrijden van het gekozen team.
var QZ = new URLSearchParams(location.search);
var VAN = App.VAN[QZ.get('van')] ? QZ.get('van') : '';                   // waar je vandaan komt (in dezelfde app)
var TERUG = VAN ? App.VAN[VAN] : App.VAN.programma;                      // zonder herkomst (direct geopend): terug naar Programma
function zaalPagina(D, naam) {
  var q = QZ, nu = new Date();
  var fluit = Wedstrijden.speelbaar(D.wedstrijden).filter(function (w) { return w.hal === 'De Fluit' && w.tijdstip; });
  var perDag = {};
  fluit.forEach(function (w) { var k = App.dagSleutel(new Date(w.tijdstip)); (perDag[k] = perDag[k] || []).push(w); });
  var dagen = Object.keys(perDag).sort(), vandaag = App.dagSleutel(nu);
  if (!dagen.length) return '<div class="melding leeg"><strong>Geen wedstrijden in De Fluit gevonden</strong></div>';
  var dag = perDag[q.get('dag')] ? q.get('dag') : (perDag[vandaag] ? vandaag : (dagen.filter(function (k) { return k >= vandaag; })[0] || dagen[dagen.length - 1]));
  var rondes = [];
  perDag[dag].forEach(function (w) { var t = App.tijd(new Date(w.tijdstip)); if (rondes.indexOf(t) === -1) rondes.push(t); });
  rondes.sort();
  var ronde = rondes.indexOf(q.get('ronde')) !== -1 ? q.get('ronde') : null;
  if (!ronde) {
    ronde = rondes[0];
    rondes.forEach(function (t) { if (new Date(dag + 'T' + t + ':00').getTime() - 30 * 60e3 <= nu.getTime()) ronde = t; });
  }
  var actief = perDag[dag].filter(function (w) { return App.tijd(new Date(w.tijdstip)) === ronde; });
  // Alleen een veld uit het zaalschema staat in de tekening; zonder correctie zou het Nevobo-nummer een verzonnen plek geven
  var bevestigd = actief.filter(function (w) { return Wedstrijden.heeftCorrectie(w, D.correcties); });
  var onbevestigd = actief.filter(function (w) { return !Wedstrijden.heeftCorrectie(w, D.correcties); });
  var perVeld = {};
  bevestigd.forEach(function (w) { var v = Wedstrijden.veldNummer(w, D.correcties) || '?'; (perVeld[v] = perVeld[v] || []).push(w); });

  // Welke wedstrijden kleuren? Het veld uit de link, anders de wedstrijden van het gekozen team
  var veldParam = q.get('veld');
  function isGekozen(w) {
    if (!Wedstrijden.heeftCorrectie(w, D.correcties)) return false;   // zonder bevestigd veld kleuren we niets
    if (veldParam) { var v = Wedstrijden.veldNummer(w, D.correcties); return v === veldParam || (veldParam === '4G' && v === '4') || (veldParam === '4' && v === '4G'); }
    return !!naam && App.team(w, naam);
  }
  var gekozen = bevestigd.filter(isGekozen), eigenGekozen = gekozen.filter(function (w) { return !!naam && App.team(w, naam); });

  var vanQ = VAN ? '&van=' + VAN : '';   // de herkomst blijft behouden als je van ronde of dag wisselt
  var d = new Date(dag + 'T12:00:00');
  var html = '<p style="margin:10px 0 0"><a class="knop" id="terug" href="' + TERUG[0] + '">← Terug naar ' + App.esc(TERUG[1]) + '</a></p><h2 style="margin:14px 2px 6px">' + App.esc(App.dagTekst(d)) + '</h2>';
  html += '<div class="rondes" role="group" aria-label="Speelronde">' + rondes.map(function (t) {
    return '<a class="knop' + (t === ronde ? ' vol' : '') + '"' + (t === ronde ? ' aria-current="true"' : '') + ' href="zaal.html?dag=' + dag + '&ronde=' + t + vanQ + '">' + t + '</a>';
  }).join('') + '</div>';
  var di = dagen.indexOf(dag);
  if (gekozen.length) {
    html += '<div class="melding"><strong>' + (eigenGekozen.length ? (eigenGekozen.length === 1 ? 'Jouw wedstrijd in de zaal' : 'Jullie wedstrijden in de zaal') : 'Gekozen veld in de zaal') + '</strong>' + gekozen.map(function (w) {
      var p = Wedstrijden.perspectief(w, naam);
      return App.esc(App.teamNaam(p.eigen)) + ' tegen ' + App.esc(p.tegen) + ': ' + App.esc(Wedstrijden.veldTekst(w, D.correcties));
    }).join('<br>') + '</div>';
  }
  var onbevestigdEigen = onbevestigd.filter(function (w) { return !!naam && App.team(w, naam); });
  if (onbevestigdEigen.length) {
    html += '<div class="melding"><strong>Veld nog niet bevestigd</strong>' + onbevestigdEigen.map(function (w) {
      var p = Wedstrijden.perspectief(w, naam);
      return App.esc(App.teamNaam(p.eigen)) + ' tegen ' + App.esc(p.tegen) + ': veld nog niet bevestigd';
    }).join('<br>') + '</div>';
  } else if (!gekozen.length && (veldParam || naam)) {
    html += '<div class="melding leeg">' + (naam ? 'Voor ' + App.esc(App.teamNaam(naam)) + ' staat in deze speelronde niets in de zaal.' : 'Geen wedstrijd op dit veld in deze speelronde.') + '</div>';
  }

  function heeftGekozen(z) {
    var st = Zaal.stand(z, perVeld, ((D.standen || {})[dag + '|' + ronde] || {})[z.naam]);
    return st.velden.some(function (v) { var hier = []; Zaal.zoekNummers(v).forEach(function (nr) { hier = hier.concat(perVeld[nr] || []); }); return hier.some(isGekozen); });
  }
  Zaal.definitie.zalen.slice().sort(function (a, b) { return (heeftGekozen(b) ? 1 : 0) - (heeftGekozen(a) ? 1 : 0); }).forEach(function (z) {
    var st = Zaal.stand(z, perVeld, ((D.standen || {})[dag + '|' + ronde] || {})[z.naam]);
    var vb = [z.x - 10, z.y - 56, z.w + 20, z.h + 118].join(' ');
    var svg = '<svg class="zaal" viewBox="' + vb + '" role="img" aria-label="' + App.esc(z.naam + ', ' + st.omschrijving) + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<text class="zaal-naam" x="' + (z.x + 6) + '" y="' + (z.y - 20) + '">' + App.esc(z.naam) + '</text>';
    svg += '<rect class="omtrek" x="' + z.x + '" y="' + z.y + '" width="' + z.w + '" height="' + z.h + '" rx="10"/>';
    st.velden.forEach(function (v) {
      var marge = 14, spleet = 8, bx = z.x + marge + v.fx * (z.w - 2 * marge) + spleet / 2, by = z.y + marge + v.fy * (z.h - 2 * marge) + spleet / 2;
      var bw = v.fw * (z.w - 2 * marge) - spleet, bh = v.fh * (z.h - 2 * marge) - spleet, mx = bx + bw / 2, my = by + bh / 2;
      var hier = []; Zaal.zoekNummers(v).forEach(function (nr) { hier = hier.concat(perVeld[nr] || []); });
      var gek = hier.filter(isGekozen).length > 0;
      var cls = gek ? 'gekozen' : (hier.length ? 'bezet' : 'vrij');
      var vtekst = 'Veld ' + Zaal.labelVan(v) + (hier.length ? ', ' + hier.map(function (w) { return Wedstrijden.teamCode(w.thuis) !== null ? Wedstrijden.teamCode(w.thuis) : (Wedstrijden.teamCode(w.uit) || w.thuis); }).join(' en ') : ', vrij') + (gek ? ', gekozen veld' : '');
      svg += '<g class="veld ' + cls + '" role="group" aria-label="' + App.esc(vtekst) + '"><title>' + App.esc(vtekst) + '</title><rect x="' + bx + '" y="' + by + '" width="' + bw + '" height="' + bh + '" rx="10"/>';
      svg += '<text class="nr" x="' + mx + '" y="' + (by + 54) + '">' + App.esc(Zaal.labelVan(v)) + '</text>';
      hier.slice(0, 2).forEach(function (w, k) {
        var code = Wedstrijden.teamCode(w.thuis) !== null ? Wedstrijden.teamCode(w.thuis) : (Wedstrijden.teamCode(w.uit) || w.thuis);
        svg += '<text class="team" x="' + mx + '" y="' + (my + 18 + k * 48) + '">' + App.esc(code) + '</text>';
      });
      if (gek) svg += '<text class="gekozen-tekst" x="' + mx + '" y="' + (by + bh - 16) + '">GEKOZEN VELD</text>';
      if (hier.length > 2) svg += '<text class="meer" x="' + mx + '" y="' + (by + bh - 18) + '">+' + (hier.length - 2) + '</text>';
      svg += '</g>';
    });
    Zaal.definitie.ingangen.filter(function (g) { return g.x >= z.x - 5 && g.x < z.x + z.w; }).forEach(function (g) {
      svg += '<rect class="ingang" x="' + g.x + '" y="' + g.y + '" width="' + g.w + '" height="' + g.h + '" rx="6"/><text class="ingang-t" x="' + (g.x + g.w / 2) + '" y="' + (g.y + g.h / 2 + 7) + '">' + App.esc(g.tekst) + '</text>';
    });
    html += '<div class="kaart zaalkaart">' + svg + '</svg><p class="sub" style="margin:4px 4px 0">' + App.esc(st.omschrijving) + '</p></div>';
  });
  if (onbevestigd.length) {
    html += '<div class="melding" style="margin-top:10px"><strong>' + (onbevestigd.length === 1 ? 'Eén wedstrijd staat nog niet in de tekening' : onbevestigd.length + ' wedstrijden staan nog niet in de tekening') + '</strong>Het veld is nog niet bevestigd. Die wedstrijden staan hieronder in de lijst.</div>';
  }
  html += '<div class="legenda"><span><i class="lg gekozen"></i>gekozen veld</span><span><i class="lg bezet"></i>bezet</span><span><i class="lg vrij"></i>vrij</span></div>';

  html += '<div class="rondes" style="margin-top:14px">' + (di > 0 ? '<a class="knop" href="zaal.html?dag=' + dagen[di - 1] + vanQ + '">← Vorige speeldag</a>' : '') +
    (di < dagen.length - 1 ? '<a class="knop" href="zaal.html?dag=' + dagen[di + 1] + vanQ + '">Volgende speeldag →</a>' : '') + '</div>';
  html += '<h2>Wedstrijden van ' + App.esc(ronde) + '</h2><div class="lijst">' + bevestigd.slice().sort(function (a, b) {
    return String(Wedstrijden.veldNummer(a, D.correcties)).localeCompare(String(Wedstrijden.veldNummer(b, D.correcties)), 'nl', { numeric: true });
  }).concat(onbevestigd).map(function (w) {
    return (isGekozen(w) ? '<div class="gekozen-rand"><span class="label gekozen-label">Gekozen veld</span>' : '<div>') + App.wedstrijdKaart(w, D, { zonderRoute: true, zonderZaal: true, helpers: true, metBron: false }) + '</div>';
  }).join('') + '</div>';
  // Terug: dezelfde stap terug als je uit de app kwam (dan blijft de stand van de lijst), anders naar de pagina van herkomst
  setTimeout(function () {
    var t = document.getElementById('terug');
    if (!t) return;
    t.addEventListener('click', function (e) {
      try { sessionStorage.setItem('volevo-terug', String(Date.now())); } catch (x) {}
      var kwamVanApp = history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin && document.referrer.indexOf('/' + TERUG[0]) !== -1;
      if (kwamVanApp) { e.preventDefault(); history.back(); }
    });
  }, 0);
  return html;
}
App.start({ pagina: VAN, titel: 'Zaalindeling', teamKeuze: 'optioneel', zonderZaalKnop: true, toon: zaalPagina });
</script>
</body>
</html>

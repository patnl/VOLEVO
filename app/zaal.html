<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>VOLEVO · Zaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="app.css?v=e3ba33874042">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=f23fd34a8eec"></script>
<script src="../shared/wedstrijden.js?v=d3a7e810f0e3"></script>
<script src="../shared/zaal.js?v=1e846f9baa5d"></script>
<script src="app.js?v=4b967e4ff5cd"></script>
</head>
<body>
<script>
// De zaal van De Fluit op de telefoon: de plattegrond van De Tas en De Bocht voor één speelronde, met daaronder
// per veld wie er speelt, fluit en telt. Een wedstrijd linkt hierheen met ?dag=&ronde=&veld=, dan kleurt dat veld.
// Zonder ?veld= kleuren de wedstrijden en de beurten van het gekozen team.
var QZ = new URLSearchParams(location.search);
var VAN = App.VAN[QZ.get('van')] ? QZ.get('van') : '';                   // waar je vandaan komt (in dezelfde app)
var TERUG = VAN ? App.VAN[VAN] : null;
function zaalPagina(D, naam) {
  var q = QZ, nu = new Date(), code = Wedstrijden.teamCode(naam);
  var fluit = Wedstrijden.speelbaar(D.wedstrijden).filter(function (w) { return w.hal === 'De Fluit' && w.tijdstip; });
  var perDag = {};
  fluit.forEach(function (w) { var k = App.dagSleutel(new Date(w.tijdstip)); (perDag[k] = perDag[k] || []).push(w); });
  var dagen = Object.keys(perDag).sort(), vandaag = App.dagSleutel(nu);
  if (!dagen.length) return App.kop('De Fluit') + '<div class="melding leeg"><strong>Geen wedstrijden in De Fluit gevonden</strong></div>';
  var dag = perDag[q.get('dag')] ? q.get('dag') : (perDag[vandaag] ? vandaag : (dagen.filter(function (k) { return k >= vandaag; })[0] || dagen[dagen.length - 1]));
  var rondes = [];
  perDag[dag].forEach(function (w) { var t = App.tijd(new Date(w.tijdstip)); if (rondes.indexOf(t) === -1) rondes.push(t); });
  rondes.sort();
  var ronde = rondes.indexOf(q.get('ronde')) !== -1 ? q.get('ronde') : null;
  if (!ronde) {
    ronde = rondes[0];
    rondes.forEach(function (t) { if (new Date(dag + 'T' + t + ':00').getTime() - 30 * 60e3 <= nu.getTime()) ronde = t; });
  }
  var actief = perDag[dag].filter(function (w) { return App.tijd(new Date(w.tijdstip)) === ronde; });
  // Alleen een veld uit het zaalschema staat in de tekening; zonder correctie zou het Nevobo-nummer een verzonnen plek geven
  var bevestigd = actief.filter(function (w) { return Wedstrijden.heeftCorrectie(w, D.correcties); });
  var onbevestigd = actief.filter(function (w) { return !Wedstrijden.heeftCorrectie(w, D.correcties); });
  var perVeld = {};
  bevestigd.forEach(function (w) { var v = Wedstrijden.veldNummer(w, D.correcties) || '?'; (perVeld[v] = perVeld[v] || []).push(w); });

  // Welke wedstrijden kleuren? Het veld uit de link; anders de wedstrijden waar het gekozen team speelt, fluit of telt
  var veldParam = q.get('veld');
  function speelt(w) { return !!naam && App.team(w, naam); }
  function helpt(w) { return !!code && D.officialsOk && Wedstrijden.helpersBij(D.officials, w).some(function (h) { return h.team === code; }); }
  function isGekozen(w) {
    if (!Wedstrijden.heeftCorrectie(w, D.correcties)) return false;   // zonder bevestigd veld kleuren we niets
    if (veldParam) { var v = Wedstrijden.veldNummer(w, D.correcties); return v === veldParam || (veldParam === '4G' && v === '4') || (veldParam === '4' && v === '4G'); }
    return speelt(w) || helpt(w);
  }
  // Wat er bij een gekleurd veld staat: waarom is het van jou?
  function merk(w) { return speelt(w) ? 'jullie veld' : (helpt(w) ? 'jullie beurt' : 'gekozen veld'); }

  var vanQ = VAN ? '&van=' + VAN : '';   // de herkomst blijft behouden als je van ronde of dag wisselt
  var d = new Date(dag + 'T12:00:00'), di = dagen.indexOf(dag);
  function dagKnop(i, richting) {
    var bestaat = i >= 0 && i < dagen.length, naar = bestaat ? new Date(dagen[i] + 'T12:00:00') : null;
    return '<a class="knop rond" ' + (bestaat ? 'href="zaal.html?dag=' + dagen[i] + vanQ + '" aria-label="' + (richting < 0 ? 'Vorige' : 'Volgende') + ' speeldag, ' + App.esc(App.dagTekst(naar)) + '"' : 'aria-disabled="true" aria-label="Geen ' + (richting < 0 ? 'eerdere' : 'latere') + ' speeldag"') +
      '>' + App.icoon(richting < 0 ? 'terug' : 'verder') + '</a>';
  }
  var html = (TERUG ? '<a class="tekstlink" id="terug" href="' + TERUG[0] + '" style="margin-bottom:-18px">' + App.icoon('terug', 'klein') + 'Terug naar ' + App.esc(TERUG[1]) + '</a>' : '') +
    App.kop('De Fluit', App.dagTekst(d), '<div style="display:flex;gap:8px">' + dagKnop(di - 1, -1) + dagKnop(di + 1, 1) + '</div>');
  html += '<div class="segment rondes" role="group" aria-label="Speelronde">' + rondes.map(function (t) {
    return '<a' + (t === ronde ? ' aria-current="true"' : '') + ' href="zaal.html?dag=' + dag + '&ronde=' + t + vanQ + '">' + t + '</a>';
  }).join('') + '</div>';

  var gekozen = bevestigd.filter(isGekozen), onbevestigdEigen = onbevestigd.filter(speelt);
  if (onbevestigdEigen.length) {
    html += '<div class="melding"><strong>Veld nog niet bevestigd</strong>' + onbevestigdEigen.map(function (w) {
      var p = Wedstrijden.perspectief(w, naam);
      return App.esc(App.teamNaam(p.eigen)) + ' tegen ' + App.esc(p.tegen) + ': het veld staat nog niet in het zaalschema.';
    }).join('<br>') + '</div>';
  } else if (!gekozen.length && veldParam) {
    html += '<div class="melding leeg">Geen wedstrijd op dit veld in deze speelronde.</div>';
  }

  Zaal.definitie.zalen.forEach(function (z) {
    var st = Zaal.stand(z, perVeld, ((D.standen || {})[dag + '|' + ronde] || {})[z.naam]);
    var kolommen = [], rijen = [];
    st.velden.forEach(function (v) { if (kolommen.indexOf(v.fx) === -1) kolommen.push(v.fx); if (rijen.indexOf(v.fy) === -1) rijen.push(v.fy); });
    var velden = st.velden.slice().sort(function (a, b) { return a.fy - b.fy || a.fx - b.fx; }).map(function (v) {
      var hier = []; Zaal.zoekNummers(v).forEach(function (nr) { hier = hier.concat(perVeld[nr] || []); });
      var nr = Zaal.labelVan(v), hoog = rijen.length > 1 && v.fh > 0.75 ? ' hoog' : '', vorm = v.net === 'h' ? ' staand' : ' liggend';
      if (!hier.length) return '<div class="veld vrij' + hoog + '" role="group" aria-label="Veld ' + App.esc(nr) + ', vrij"><span class="nr">' + App.esc(nr) + '</span>vrij</div>';
      var w = hier[0], gek = hier.some(isGekozen);
      var tekst = 'Veld ' + nr + ', ' + hier.map(function (x) { return x.thuis + ' tegen ' + x.uit; }).join(' en ') + (gek ? ', ' + merk(hier.filter(isGekozen)[0]) : '');
      return '<a class="veld' + vorm + hoog + (gek ? ' jij gekozen' : ' bezet') + '" href="#ronde" aria-label="' + App.esc(tekst) + '"><span class="nr">' + App.esc(nr) + '</span>' +
        (gek ? '<span class="merk">' + App.esc(merk(hier.filter(isGekozen)[0])) + '</span>' : '') +
        '<span class="helft"><span class="thuis">' + App.esc(App.kortTeam(w.thuis)) + '</span></span>' +
        '<span class="helft"><span class="uit">' + App.esc(App.kortTeam(w.uit)) + (hier.length > 1 ? ' +' + (hier.length - 1) : '') + '</span></span></a>';
    }).join('');
    html += '<section class="zaaltekening" aria-label="Plattegrond ' + App.esc(z.naam) + '"><div class="sectiekop"><h2>' + App.esc(z.naam) + '</h2><span class="klein">' + (st === z.drie ? 'drie velden naast elkaar' : st === z.vier ? 'vier velden, twee bij twee' : 'veld 4 groot, met 5 en 6') + '</span></div>' +
      '<div class="hal ' + (z.naam === 'De Tas' ? 'tas' : 'bocht') + '" style="grid-template-columns:repeat(' + kolommen.length + ',minmax(0,1fr));grid-template-rows:repeat(' + rijen.length + ',minmax(0,1fr))">' + velden + '</div>' +
      '<div class="ingang">' + App.icoon('omhoog', 'klein') + 'ingang en tribune ' + App.esc(z.naam) + '</div></section>';
  });
  if (onbevestigd.length) {
    html += '<div class="melding"><strong>' + (onbevestigd.length === 1 ? 'Eén wedstrijd staat nog niet in de tekening' : onbevestigd.length + ' wedstrijden staan nog niet in de tekening') + '</strong>Het veld is nog niet bevestigd. Die wedstrijden staan hieronder in de lijst.</div>';
  }

  html += '<section id="ronde" aria-label="Wedstrijden in deze ronde"><div class="sectiekop"><h2>Ronde van ' + App.esc(ronde) + '</h2></div>' + bevestigd.slice().sort(function (a, b) {
    return String(Wedstrijden.veldNummer(a, D.correcties)).localeCompare(String(Wedstrijden.veldNummer(b, D.correcties)), 'nl', { numeric: true });
  }).concat(onbevestigd).map(function (w) {
    var helpers = App.helpersTekst(D, w, code), jij = isGekozen(w) || speelt(w);
    return '<div class="veldrij' + (jij ? ' jij' : '') + '"><div class="v">' + App.esc(App.veldKort(w, D) || 'Veld volgt') + '</div>' +
      '<div><div class="w">' + App.esc(w.thuis) + ' tegen ' + App.esc(w.uit) + '</div><div class="o">' +
      (!D.officialsOk ? 'Fluit- en telbeurten konden niet worden geladen.' : helpers ? App.esc(helpers) + '.' : 'Nog geen beurten bekend.') + '</div></div></div>';
  }).join('') + '</section>';
  html += '<div class="acties"><a class="knop vol" target="_blank" rel="noopener" aria-label="Route naar De Fluit" href="' + App.esc(App.routeUrl({ hal: 'De Fluit', plaats: 'Leidschendam' })) + '">Route naar De Fluit</a></div>' +
    '<p class="klein">Sporthal De Fluit, Fluitpolderplein 3, 2262 ED Leidschendam. Beide zalen hebben een eigen ingang aan de kant van de tribune.</p>';
  // Terug: dezelfde stap terug als je uit de app kwam (dan blijft de stand van de lijst), anders naar de pagina van herkomst
  setTimeout(function () {
    var t = document.getElementById('terug');
    if (!t) return;
    t.addEventListener('click', function (e) {
      try { sessionStorage.setItem('volevo-terug', String(Date.now())); } catch (x) {}
      var kwamVanApp = history.length > 1 && document.referrer && new URL(document.referrer).origin === location.origin && document.referrer.indexOf('/' + TERUG[0]) !== -1;
      if (kwamVanApp) { e.preventDefault(); history.back(); }
    });
  }, 0);
  return html;
}
App.start({ pagina: 'zaal', titel: 'Zaal', teamKeuze: 'optioneel', toon: zaalPagina });
</script>
</body>
</html>

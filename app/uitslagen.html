<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A3176">
<title>VOLEVO · Uitslagen</title>
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js"></script>
<script src="../shared/wedstrijden.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
var AANTAL = 12, getoond = AANTAL, uitslagen = null;
async function laadUitslagen() {
  if (uitslagen) return uitslagen;
  var r = await fetch('../data/resultaten.xml?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('resultaten ' + r.status);
  var xml = new DOMParser().parseFromString(await r.text(), 'text/xml'), lijst = [];
  xml.querySelectorAll('item').forEach(function (item) {
    var titel = (item.querySelector('title') || {}).textContent || '', uitleg = (item.querySelector('description') || {}).textContent || '';
    var st = item.getElementsByTagNameNS('*', 'status')[0];
    if (st && Wedstrijden.isVervallen(st.textContent.trim())) return;
    var i = titel.indexOf(', Uitslag:'); if (i === -1) return;
    var paar = titel.substring(0, i).split(' - '); if (paar.length < 2) return;
    var sets = /Setstanden:\s*([^\r\n<]+)/i.exec(uitleg);
    var id = ((item.querySelector('guid') || {}).textContent || (item.querySelector('link') || {}).textContent || '').trim();
    lijst.push({ id: id, thuis: paar[0].trim(), uit: paar.slice(1).join(' - ').trim(), score: titel.substring(i + 10).trim(),
      sets: sets ? sets[1].trim() : '', tijd: new Date((item.querySelector('pubDate') || {}).textContent) });
  });
  // Een wedstrijd tussen twee VOLEVO-teams staat twee keer in de feed: één keer tonen
  uitslagen = Wedstrijden.ontdubbel(lijst).sort(function (a, b) { return b.tijd - a.tijd; });
  return uitslagen;
}
// De uitslag als twee regels, thuis en uit, met de score bij het juiste team; de winnaar staat er in woorden bij
function uitslagKaart(u, naam) {
  var k = Wedstrijden.uitkomst(u.score), res = Wedstrijden.resultaatVoorTeam(u, naam);
  var badge = '';
  if (naam && (u.thuis === naam || u.uit === naam)) {
    badge = res ? '<span class="uitslag-badge ' + res.toLowerCase() + '">' + res + '</span>' : '<span class="uitslag-badge onbekend">Uitslag onbekend</span>';
  }
  function regel(team, punten, wint) {
    return '<p class="teams" style="margin:4px 0 0;display:flex;justify-content:space-between;gap:10px"><span class="' + (wint ? 'winnaar' : '') + '">' + App.esc(team) + '</span><span class="score">' + App.esc(punten) + '</span></p>';
  }
  var winnaarTekst = k.winnaar === 'thuis' ? 'Winnaar: ' + u.thuis : (k.winnaar === 'uit' ? 'Winnaar: ' + u.uit : (k.winnaar === 'gelijk' ? 'Gelijkspel' : 'Uitslag onvolledig of onbekend'));
  return '<article class="kaart"><div class="rij1"><span class="sub" style="margin:0">' + App.esc(App.kort(u.tijd)) + '</span>' + badge + '</div>' +
    regel(u.thuis + ' (thuis)', k.winnaar ? String(k.thuis) : '–', k.winnaar === 'thuis') + regel(u.uit + ' (uit)', k.winnaar ? String(k.uit) : '–', k.winnaar === 'uit') +
    '<p class="plek" style="margin-top:8px"><strong>' + App.esc(winnaarTekst) + '</strong>' + (naam && badge === '' ? '' : '') + '</p>' +
    (u.sets ? '<p class="sets">Setstanden (thuis–uit): ' + App.esc(u.sets) + '</p>' : '') +
    (App.bronKnop(u.id, 'Bekijk bij Nevobo') ? '<div class="acties">' + App.bronKnop(u.id, 'Bekijk bij Nevobo') + '</div>' : '') + '</article>';
}
async function toonUitslagen(naam) {
  var alle = await laadUitslagen();
  var lijst = alle.filter(function (u) { return !naam || u.thuis === naam || u.uit === naam; });
  var html = '<h2>' + (naam ? 'Uitslagen ' + App.esc(App.teamNaam(naam)) : 'Uitslagen alle teams') + '</h2>';
  if (!lijst.length) return html + '<div class="melding leeg"><strong>Geen uitslagen voor deze keuze</strong>Er zijn nog geen uitslagen binnen. Kijk later nog eens.</div>';
  html += '<p class="sub">' + Math.min(getoond, lijst.length) + ' van ' + lijst.length + ' uitslagen, nieuwste eerst</p><div class="lijst">';
  lijst.slice(0, getoond).forEach(function (u) { html += uitslagKaart(u, naam); });
  html += '</div>';
  if (lijst.length > getoond) html += '<div class="acties" style="margin-top:14px"><button class="knop vol" id="meer">Toon meer uitslagen</button></div>';
  return html;
}
async function teken(naam) {
  var inhoud = document.getElementById('inhoud');
  try { inhoud.innerHTML = await toonUitslagen(naam); }
  catch (e) { inhoud.innerHTML = '<div class="melding fout"><strong>De uitslagen kunnen nu niet worden opgehaald.</strong>Probeer het opnieuw met de knop rechtsboven.</div>'; return; }
  var m = document.getElementById('meer');
  if (m) m.addEventListener('click', function () { getoond += AANTAL; teken(naam); });
  App.herstelStaat();
}
App.start({
  pagina: 'uitslagen', titel: 'Uitslagen', teamKeuze: 'optioneel',
  toon: function (D, naam) { uitslagen = null; teken(naam); return '<div class="melding leeg">Uitslagen ophalen…</div>'; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A3176">
<title>VOLEVO · Uitslagen</title>
<link rel="stylesheet" href="app.css">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js"></script>
<script src="../shared/wedstrijden.js"></script>
<script src="app.js"></script>
</head>
<body>
<script>
var AANTAL = 12, getoond = AANTAL, uitslagen = null;
async function laadUitslagen() {
  if (uitslagen) return uitslagen;
  var r = await fetch('../data/resultaten.xml?t=' + Date.now(), { cache: 'no-store' });
  if (!r.ok) throw new Error('resultaten ' + r.status);
  var xml = new DOMParser().parseFromString(await r.text(), 'text/xml'), lijst = [];
  xml.querySelectorAll('item').forEach(function (item) {
    var titel = (item.querySelector('title') || {}).textContent || '', uitleg = (item.querySelector('description') || {}).textContent || '';
    var st = item.getElementsByTagNameNS('*', 'status')[0];
    if (st && st.textContent.trim() === 'vervallen') return;
    var i = titel.indexOf(', Uitslag:'); if (i === -1) return;
    var paar = titel.substring(0, i).split(' - '); if (paar.length < 2) return;
    var sets = /Setstanden:\s*([^\r\n<]+)/i.exec(uitleg);
    lijst.push({ thuis: paar[0].trim(), uit: paar.slice(1).join(' - ').trim(), score: titel.substring(i + 10).trim(),
      sets: sets ? sets[1].trim() : '', tijd: new Date((item.querySelector('pubDate') || {}).textContent) });
  });
  uitslagen = lijst.sort(function (a, b) { return b.tijd - a.tijd; });
  return uitslagen;
}
async function toonUitslagen(naam) {
  var alle = await laadUitslagen();
  var lijst = alle.filter(function (u) { return !naam || u.thuis === naam || u.uit === naam; });
  var html = '<h2>' + (naam ? 'Uitslagen ' + App.esc(App.teamNaam(naam)) : 'Uitslagen alle teams') + '</h2>';
  if (!lijst.length) return html + '<div class="melding leeg"><strong>Geen uitslagen voor deze keuze</strong>Er zijn nog geen uitslagen binnen. Kijk later nog eens.</div>';
  html += '<p class="sub">' + Math.min(getoond, lijst.length) + ' van ' + lijst.length + ' uitslagen, nieuwste eerst</p><div class="lijst">';
  lijst.slice(0, getoond).forEach(function (u) {
    html += '<article class="kaart"><div class="rij1"><span class="sub" style="margin:0">' + App.esc(App.kort(u.tijd)) + '</span><span class="score">' + App.esc(u.score) + '</span></div>' +
      '<p class="teams">' + App.esc(u.thuis) + '<br><span class="tegen">tegen ' + App.esc(u.uit) + '</span></p>' + (u.sets ? '<p class="sets">Sets: ' + App.esc(u.sets) + '</p>' : '') + '</article>';
  });
  html += '</div>';
  if (lijst.length > getoond) html += '<div class="acties" style="margin-top:14px"><button class="knop vol" id="meer">Toon meer uitslagen</button></div>';
  return html;
}
async function teken(naam) {
  var inhoud = document.getElementById('inhoud');
  try { inhoud.innerHTML = await toonUitslagen(naam); }
  catch (e) { inhoud.innerHTML = '<div class="melding fout"><strong>De uitslagen kunnen nu niet worden opgehaald.</strong>Probeer het opnieuw met de knop rechtsboven.</div>'; return; }
  var m = document.getElementById('meer');
  if (m) m.addEventListener('click', function () { getoond += AANTAL; teken(naam); });
}
App.start({
  pagina: 'uitslagen', titel: 'Uitslagen', teamKeuze: 'optioneel',
  toon: function (D, naam) { uitslagen = null; getoond = AANTAL; teken(naam); return '<div class="melding leeg">Uitslagen ophalen…</div>'; }
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2A3176">
<title>VOLEVO · Uitslagen</title>
<link rel="stylesheet" href="app.css?v=b02a7fc83271">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=f23fd34a8eec"></script>
<script src="../shared/wedstrijden.js?v=47d9ac833da4"></script>
<script src="app.js?v=f1542e1f40da"></script>
<script src="resultaten.js?v=478d277abedf"></script>
</head>
<body>
<script>
var AANTAL = 12, getoond = AANTAL, uitslagen = null, laadVolgnummer = 0, tekenVolgnummer = 0, laatsteTeam = null;
async function laadUitslagen() {
  if (uitslagen) return uitslagen;
  var aanvraag = ++laadVolgnummer;
  var gesorteerd = await Resultaten.laad();
  // Een oudere aanvraag mag ook de cache voor de volgende pagina niet terugdraaien.
  if (aanvraag === laadVolgnummer) uitslagen = gesorteerd;
  return gesorteerd;
}
// De uitslag als twee regels, thuis en uit, met de score bij het juiste team; de winnaar staat er in woorden bij
async function toonUitslagen(naam) {
  var alle = await laadUitslagen();
  var lijst = alle.filter(function (u) { return !naam || u.thuis === naam || u.uit === naam; });
  var html = '<h2>' + (naam ? 'Uitslagen ' + App.esc(App.teamNaam(naam)) : 'Uitslagen alle teams') + '</h2>';
  if (!lijst.length) return html + '<div class="melding leeg"><strong>Geen uitslagen voor deze keuze</strong>Er zijn nog geen uitslagen binnen. Kijk later nog eens.</div>';
  html += '<p class="sub">' + Math.min(getoond, lijst.length) + ' van ' + lijst.length + ' uitslagen, nieuwste eerst</p><div class="lijst">';
  lijst.slice(0, getoond).forEach(function (u) { html += Resultaten.kaart(u, naam); });
  html += '</div>';
  if (lijst.length > getoond) html += '<div class="acties" style="margin-top:14px"><button class="knop vol" id="meer">Toon meer uitslagen</button></div>';
  return html;
}
async function teken(naam) {
  var inhoud = document.getElementById('inhoud'), versie = ++tekenVolgnummer;
  try {
    var html = await toonUitslagen(naam);
    if (versie !== tekenVolgnummer) return;
    inhoud.innerHTML = html;
  } catch (e) {
    if (versie !== tekenVolgnummer) return;
    inhoud.innerHTML = '<div class="melding fout"><strong>De uitslagen kunnen nu niet worden opgehaald.</strong>Probeer het opnieuw met de knop rechtsboven.</div>'; return;
  }
  var m = document.getElementById('meer');
  if (m) m.addEventListener('click', function () { getoond += AANTAL; teken(naam); });
  App.herstelStaat();
}
App.start({
  pagina: 'uitslagen', titel: 'Uitslagen', teamKeuze: 'optioneel',
  toon: function (D, naam) {
    if (naam !== laatsteTeam) { getoond = AANTAL; laatsteTeam = naam; }
    uitslagen = null; teken(naam); return '<div class="melding leeg">Uitslagen ophalen…</div>';
  }
});
</script>
</body>
</html>

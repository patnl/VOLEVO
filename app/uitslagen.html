<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>VOLEVO · Uitslagen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="app.css?v=e3ba33874042">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=f23fd34a8eec"></script>
<script src="../shared/wedstrijden.js?v=d3a7e810f0e3"></script>
<script src="app.js?v=4b967e4ff5cd"></script>
<script src="resultaten.js?v=3f70f22a95ff"></script>
</head>
<body>
<script>
// Uitslagen: nieuwste eerst, per dag. Met een gekozen team staat jullie laatste wedstrijd groot bovenaan.
var AANTAL = 20, getoond = AANTAL, uitslagen = null, laadVolgnummer = 0, tekenVolgnummer = 0, laatsteTeam = null;
async function laadUitslagen() {
  if (uitslagen) return uitslagen;
  var aanvraag = ++laadVolgnummer;
  var gesorteerd = await Resultaten.laad();
  // Een oudere aanvraag mag ook de cache voor de volgende pagina niet terugdraaien.
  if (aanvraag === laadVolgnummer) uitslagen = gesorteerd;
  return gesorteerd;
}
function kopHtml(naam, b) { return App.kop('Wedstrijden') + App.wedstrijdenKeuze('uitslagen', b.zoek) + b.html; }
async function toonUitslagen(naam) {
  var b = App.bereik(naam, 'uitslagen.html'), alle = await laadUitslagen();
  var lijst = alle.filter(function (u) { return b.alle || u.thuis === naam || u.uit === naam; });
  var html = kopHtml(naam, b);
  if (!lijst.length) return html + '<div class="melding leeg"><strong>Geen uitslagen voor deze keuze</strong>Er zijn nog geen uitslagen binnen. Kijk later nog eens.</div>';
  var eerste = 0;
  if (!b.alle) { html += Resultaten.eigen(lijst[0], naam, 'Jullie laatste wedstrijd, ' + App.dagKort(lijst[0].tijd)); eerste = 1; }
  var zichtbaar = lijst.slice(eerste, getoond), dag = '';
  html += '<section class="lijst" aria-label="Uitslagen ' + App.esc(b.alle ? 'alle teams' : App.teamNaam(naam)) + '">';
  zichtbaar.forEach(function (u) {
    var k = App.dagSleutel(u.tijd);
    if (k !== dag) { html += '<h2 class="dagkop">' + App.esc(App.dagTekst(u.tijd)) + '</h2>'; dag = k; }
    html += Resultaten.kaart(u, naam);
  });
  html += '</section><p class="klein">' + Math.min(getoond, lijst.length) + ' van ' + lijst.length + ' uitslagen, nieuwste eerst. Bij elke uitslag staat het thuisteam boven.</p>';
  if (lijst.length > getoond) html += '<button class="knop" id="meer">Toon meer uitslagen</button>';
  return html;
}
async function teken(naam) {
  var inhoud = document.getElementById('inhoud'), versie = ++tekenVolgnummer;
  try {
    var html = await toonUitslagen(naam);
    if (versie !== tekenVolgnummer) return;
    inhoud.innerHTML = html;
  } catch (e) {
    if (versie !== tekenVolgnummer) return;
    inhoud.innerHTML = kopHtml(naam, App.bereik(naam, 'uitslagen.html')) + '<div class="melding fout"><strong>De uitslagen kunnen nu niet worden opgehaald.</strong>Probeer het opnieuw.<div><button class="knop" data-herlaad>Opnieuw proberen</button></div></div>'; return;
  }
  var m = document.getElementById('meer');
  if (m) m.addEventListener('click', function () { getoond += AANTAL; teken(naam); });
  App.herstelStaat();
}
App.start({
  pagina: 'uitslagen', titel: 'Uitslagen', teamKeuze: 'optioneel',
  toon: function (D, naam) {
    if (naam !== laatsteTeam) { getoond = AANTAL; laatsteTeam = naam; }
    uitslagen = null; teken(naam);
    return kopHtml(naam, App.bereik(naam, 'uitslagen.html')) + '<div class="melding leeg">Uitslagen ophalen…</div>';
  }
});
</script>
</body>
</html>

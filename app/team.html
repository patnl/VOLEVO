<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>VOLEVO · Mijn team</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<link rel="stylesheet" href="app.css?v=e3ba33874042">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="VOLEVO">
<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=4fcc8f3ef3cc"></script>
<script src="../shared/wedstrijden.js?v=d3a7e810f0e3"></script>
<script src="app.js?v=4b967e4ff5cd"></script>
<script src="resultaten.js?v=3f70f22a95ff"></script>
</head>
<body>
<script>
// Mijn team: de stand, jullie beurten, de volgende wedstrijden, de laatste uitslag en de rest van wat bij het team hoort.
var teamVersie = 0, resultaatCache = null;

function komendHtml(D, naam, uitslagen) {
  var start = new Date(); start.setHours(0, 0, 0, 0);
  var eigen = D.wedstrijden.filter(function (w) { return App.team(w, naam); });
  var komend = Wedstrijden.speelbaar(eigen).filter(function (w) {
    return w.tijdstip && new Date(w.tijdstip) >= start && w.status !== 'gespeeld' && !Resultaten.heeftUitslag(w, uitslagen || []);
  }).sort(function (a, b) { return new Date(a.tijdstip) - new Date(b.tijdstip); });
  return App.vervallenMeldingen(eigen) + (komend.length ? '<div class="lijst">' + komend.slice(0, 3).map(function (w) {
    return App.wedstrijdRij(w, D, { metDatum: true, van: 'team' });
  }).join('') + '</div>' + (komend.length > 3 ? '<p class="klein" style="padding-top:10px">En nog ' + (komend.length - 3) + ' daarna. Het hele rijtje staat in het programma.</p>' : '')
    : '<p class="klein">Geen komende wedstrijden gevonden voor dit team.</p>');
}

async function toonGespeeld(naam, versie, D) {
  try {
    var alle = resultaatCache || await Resultaten.laad();
    if (versie !== teamVersie) return;
    resultaatCache = alle;
    var lijst = alle.filter(function (u) { return App.team(u, naam); });
    var doel = document.getElementById('teamuitslagen');
    if (!doel) return;
    var programma = document.getElementById('teamprogramma');
    if (programma && D) programma.innerHTML = komendHtml(D, naam, alle);
    doel.innerHTML = lijst.length ? '<div class="lijst">' + Resultaten.kaart(lijst[0], naam, { metDatum: true }) + '</div>' :
      '<p class="klein">Er zijn nog geen uitslagen beschikbaar voor dit team.</p>';
  } catch (e) {
    if (versie !== teamVersie) return;
    var doel = document.getElementById('teamuitslagen');
    if (doel) doel.innerHTML = '<div class="melding fout"><strong>Uitslagen konden niet worden geladen.</strong><div><button class="knop" data-herlaad>Opnieuw proberen</button></div></div>';
  }
}

function beurtenHtml(D, naam) {
  if (!D.officialsOk) return '<div class="melding fout"><strong>Taken konden niet worden geladen</strong>De fluit- en telbeurten zijn nu niet beschikbaar. Dit betekent niet dat er geen beurten zijn.<div><button class="knop" data-herlaad>Opnieuw proberen</button></div></div>';
  var nu = new Date(), start = new Date(); start.setHours(0, 0, 0, 0);
  var taken = App.takenVan(D, Wedstrijden.teamCode(naam)).filter(function (t) { return new Date(t.tijdstip) >= start; });
  if (!taken.length) return '<p class="klein">Geen beurten gevonden: er staan nu geen fluit- of telbeurten voor jullie op de planning.</p>';
  var vandaag = App.dagSleutel(nu), eerstKomend = taken.filter(function (t) { return new Date(t.tijdstip).getTime() + 90 * 60e3 > nu.getTime(); })[0];
  return '<div class="lijst">' + taken.slice(0, 4).map(function (t) {
    var d = new Date(t.tijdstip), klaar = d.getTime() + 90 * 60e3 <= nu.getTime();
    return App.taakRij(t, D, { van: 'team', klaar: klaar, jij: t === eerstKomend, onder: App.dagSleutel(d) === vandaag ? (klaar ? 'geweest' : 'vandaag') : '' });
  }).join('') + '</div>' + (taken.length > 4 ? '<p class="klein" style="padding-top:10px">En nog ' + (taken.length - 4) + ' daarna.</p>' : '');
}

App.start({ pagina: 'team', titel: 'Mijn team', teamKeuze: 'verplicht', kiesTekst: 'Dan zie je hier de stand, jullie fluit- en telbeurten, de volgende wedstrijden en de laatste uitslag.',
  toon: function (D, naam) {
    var versie = ++teamVersie, stand = App.teamStand(D, naam), delen = stand.beschikbaar ? App.standDelen(stand.tekst) : null;
    resultaatCache = null;
    var bron = Wedstrijden.bronLink(stand.bron);
    var pil = delen ? (bron ? '<a class="standpil" target="_blank" rel="noopener noreferrer" href="' + App.esc(bron) + '" aria-label="' + App.esc(stand.tekst) + ', bekijk de stand bij Nevobo (nieuw venster)">' : '<div class="standpil">') +
      '<b>' + App.esc(delen.plaats) + '</b><span>in de stand' + (bron ? ' ↗' : '') + '</span>' + (bron ? '</a>' : '</div>') : '';
    var html = App.kop(App.teamNaam(naam), delen ? delen.poule : stand.tekst, pil) +
      (stand.oud && stand.beschikbaar ? '<p class="klein" style="margin-top:-18px">De stand is van ' + App.esc(stand.datum || 'onbekende datum') + ' en kan verouderd zijn.</p>' : '') +
      (!delen && bron ? '<div>' + App.bronKnop(stand.bron, 'Bekijk team bij Nevobo') + '</div>' : '') +
      '<section aria-label="Fluiten en tellen"><div class="sectiekop"><h2>Fluiten en tellen</h2><a href="fluiten.html">Alle beurten</a></div>' + beurtenHtml(D, naam) + '</section>' +
      '<section id="komend" aria-label="Volgende wedstrijden"><div class="sectiekop"><h2>Volgende wedstrijden</h2><a href="programma.html">Programma</a></div><div id="teamprogramma">' + komendHtml(D, naam, []) + '</div></section>' +
      '<section id="gespeeld" aria-label="Laatste uitslag"><div class="sectiekop"><h2>Laatste uitslag</h2><a href="uitslagen.html">Uitslagen</a></div><div id="teamuitslagen" aria-live="polite"><p class="klein">Uitslagen ophalen…</p></div></section>' +
      '<section aria-label="Meer voor ' + App.esc(App.teamNaam(naam)) + '">' +
      '<a class="door laag" href="training.html">Trainingsschema' + App.icoon('verder') + '</a>' +
      '<a class="door laag" href="wijzigingen.html">Wijzigingen in het programma' + App.icoon('verder') + '</a>' +
      App.beginscherm() + '</section>';
    Promise.resolve().then(function () { toonGespeeld(naam, versie, D); });
    return html;
  } });
</script>
</body>
</html>

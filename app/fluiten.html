<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>VOLEVO · Fluiten en tellen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script>var VOLEVO_DATA = '../';</script>
<script src="../overrides.js?v=4fcc8f3ef3cc"></script>
<script src="../shared/wedstrijden.js?v=d3a7e810f0e3"></script>
<script src="app.js?v=4b967e4ff5cd"></script>
</head>
<body>
<script>
// Fluiten en tellen: de beurten van je team, wie er bij jullie eigen wedstrijden helpt, en het rooster van alle teams.
function eigenBeurten(D, naam) {
  var code = Wedstrijden.teamCode(naam), nu = new Date(), start = new Date(); start.setHours(0, 0, 0, 0);
  var week = new Date(start.getTime() + 7 * 24 * 3600e3);
  var taken = App.takenVan(D, code).filter(function (t) { return new Date(t.tijdstip) >= start; });
  var rij = function (t) { return App.taakRij(t, D, { van: 'fluiten', klaar: new Date(t.tijdstip).getTime() + 90 * 60e3 <= nu.getTime() }); };
  var dezeWeek = taken.filter(function (t) { return new Date(t.tijdstip) < week; }), later = taken.filter(function (t) { return new Date(t.tijdstip) >= week; });
  var html = '';
  if (!D.officialsOk) {
    html += '<div class="melding fout"><strong>Taken konden niet worden geladen</strong>De fluit- en telbeurten zijn nu niet beschikbaar. Dit betekent niet dat er geen beurten zijn.' +
      '<div><button class="knop vol" data-herlaad>Opnieuw proberen</button></div></div>';
  } else {
    html += '<p class="onder" style="margin-top:-14px">Deze beurten heeft ' + App.esc(App.teamNaam(naam)) + '. Wie de beurt uitvoert, spreek je af met je teamcontactpersoon.</p>';
    if (!taken.length) html += '<div class="melding leeg"><strong>Geen beurten gevonden voor jullie team</strong>Er staan nu geen fluit- of telbeurten op de planning.</div>';
  }
  if (dezeWeek.length) html += '<section aria-label="Deze week"><div class="sectiekop"><h2>Deze week</h2></div><div class="lijst">' + dezeWeek.map(rij).join('') + '</div></section>';
  if (later.length) html += '<section aria-label="Later"><div class="sectiekop"><h2>Later</h2></div><div class="lijst">' + later.slice(0, 20).map(rij).join('') + '</div>' +
    (later.length > 20 ? '<p class="klein" style="padding-top:10px">En nog ' + (later.length - 20) + ' latere beurten.</p>' : '') + '</section>';

  var eigen = Wedstrijden.speelbaar(D.wedstrijden.filter(function (w) { return w.tijdstip && App.team(w, naam); }))
    .filter(function (w) { return new Date(w.tijdstip) >= start; }).sort(function (a, b) { return new Date(a.tijdstip) - new Date(b.tijdstip); }).slice(0, 4);
  html += '<section aria-label="Wie helpt bij jullie wedstrijd"><div class="sectiekop"><h2>Wie helpt bij jullie wedstrijd</h2></div>';
  html += eigen.length ? '<div class="lijst">' + eigen.map(function (w) {
    var d = new Date(w.tijdstip), p = Wedstrijden.perspectief(w, naam), helpers = App.helpersTekst(D, w, code);
    return '<div class="rij"><div><div class="t">' + App.esc(App.tijd(d)) + '</div><div class="d">' + App.esc(App.dagKort(d)) + '</div></div>' +
      '<div><div class="w">' + (p.eigenThuis ? 'Thuis' : 'Uit') + ' tegen ' + App.esc(p.tegen) + '</div><div class="o">' +
      (!D.officialsOk ? 'Fluit- en telbeurten konden niet worden geladen.' : helpers ? App.esc(helpers) + '.' : (p.eigenThuis ? 'Nog niet bevestigd. Vraag je teamcontactpersoon wat voor jullie geldt.' : 'Uitwedstrijd: de thuisclub regelt de beurten.')) + '</div></div></div>';
  }).join('') + '</div>' : '<p class="klein">Geen komende wedstrijden gevonden.</p>';
  return html + '</section>';
}
// Het rooster van alle teams voor de komende drie weken, per dag
function alleBeurten(D, naam) {
  if (!D.officialsOk) return '<div class="melding fout"><strong>Taken konden niet worden geladen</strong>De fluit- en telbeurten zijn nu niet beschikbaar. Dit betekent niet dat er geen beurten zijn.' +
    '<div><button class="knop vol" data-herlaad>Opnieuw proberen</button></div></div>';
  var code = Wedstrijden.teamCode(naam), start = new Date(); start.setHours(0, 0, 0, 0);
  var eind = new Date(start.getTime() + 21 * 24 * 3600e3);
  var lijst = Wedstrijden.speelbaar(D.wedstrijden).filter(function (w) {
    return w.tijdstip && new Date(w.tijdstip) >= start && new Date(w.tijdstip) < eind && Wedstrijden.helpersBij(D.officials, w).length;
  }).sort(function (a, b) { return new Date(a.tijdstip) - new Date(b.tijdstip) || String(Wedstrijden.veldNummer(a, D.correcties)).localeCompare(String(Wedstrijden.veldNummer(b, D.correcties))); });
  if (!lijst.length) return '<div class="melding leeg"><strong>Geen beurten gevonden</strong>Voor de komende drie weken staan er geen fluit- of telbeurten in het schema.</div>';
  var html = '<section class="lijst" aria-label="Beurten van alle teams">', dag = '';
  lijst.forEach(function (w) {
    var d = new Date(w.tijdstip), k = App.dagSleutel(d), veld = App.veldKort(w, D);
    var zelf = !!code && Wedstrijden.helpersBij(D.officials, w).some(function (h) { return h.team === code; });
    if (k !== dag) { html += '<h2 class="dagkop">' + App.esc(App.dagTekst(d)) + '</h2>'; dag = k; }
    html += '<div class="rij' + (zelf ? ' jij' : '') + '"><div><div class="t">' + App.esc(App.tijd(d)) + '</div>' + (veld ? '<div class="d">' + App.esc(veld) + '</div>' : '') + '</div>' +
      '<div><div class="w">' + App.esc(App.kortTeam(w.thuis)) + ' tegen ' + App.esc(w.uit) + '</div><div class="o">' + App.esc(App.helpersTekst(D, w, code)) + '</div></div></div>';
  });
  return html + '</section><p class="klein">Het rooster van de komende drie weken, uit het officialschema van de club.</p>';
}
App.start({ pagina: 'fluiten', titel: 'Fluiten en tellen', teamKeuze: 'verplicht', kiesTekst: 'Dan zie je hier wanneer jullie fluiten of tellen, en wie er bij jullie eigen wedstrijden helpt.',
  toon: function (D, naam) {
    var b = App.bereik(naam, 'fluiten.html');
    return App.kop('Fluiten en tellen') + b.html + (b.alle ? alleBeurten(D, naam) : eigenBeurten(D, naam));
  } });
</script>
</body>
</html>
